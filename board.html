    <style>

        }
        .editor-block{

            font-size:17px;
            line-height:2.2;
        }
        .label{
            display:inline-block;
            width:80px;
            font-weight:bold;
        }
        .member-grid{
            display: grid;
            grid-template-columns: 120px 120px 120px;
            gap:6px 12px;
            margin-top:8px;
        }
    </style>
</head>
